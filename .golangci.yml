version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - forcetypeassert
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace

  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: var-naming
        - name: indent-error-flow
        - name: error-return
        - name: error-naming

  exclusions:
    rules:
      # Test files exercise the L0 invisible-glyph + Trojan-source defenses.
      # The literals MUST contain the actual codepoints (visual fidelity to
      # the attack) so an editor + diff reader sees what an attacker would
      # paste. Escape-sequence rewrites lose that signal. The defenses are
      # under test; this is intentional in fixtures, not code.
      - path: _test\.go
        linters: [gosec, staticcheck]
        text: "G116|G204|G304|G301|G306|ST1018"
      - path: _test\.go
        linters: [goconst]
      # L0 invisible-glyph corpus comments belong in non-test source too.
      - path: internal/l0/normalize\.go
        linters: [staticcheck]
        text: "ST1018"
      # Markdown adapter intentionally reads user-supplied work-item paths
      # (catalog root from regatta.yaml). The path is bounded by the
      # adapter's root field and the .regatta/items/ glob; G304 here is the
      # adapter's whole purpose.
      - path: internal/orchestrator/adapter/markdown\.go
        linters: [gosec]
        text: "G304|G306|G703"
      # L0 ref-resolver invokes `git diff` with bounded args. The "variable"
      # is the base-ref string the caller passes; gosec cannot prove the
      # bound, but it is L0's contract surface.
      - path: internal/l0/refs\.go
        linters: [gosec]
        text: "G204"
      # validate-config CLI reads the operator-supplied regatta.yaml path.
      # G304 cannot prove safety; the operator IS the trust root for this
      # path (same as `cat <file>`).
      - path: internal/validateconfig/load\.go
        linters: [gosec]
        text: "G304"
      # internal/program is the MVP-1 program-layer foundation. The
      # goconst hits inside provider_anthropic.go are JSON Schema
      # vocabulary tokens ("type", "array", "items", "string", etc.),
      # not configuration; extracting them as constants would obscure
      # the schema shape. The gosec G304 hits are operator-supplied
      # paths the operator IS trust root for (same shape as L0/diff).
      - path: internal/program/provider_anthropic\.go
        linters: [goconst]
      - path: internal/program/handoff\.go
        linters: [gosec]
        text: "G304|G602"
      - path: internal/program/corpus_test\.go
        linters: [gosec]
        text: "G122"
      # internal/securitygate shells out to operator-pinned binaries
      # (gitleaks, osv-scanner) via safety.tool_versions. The command
      # name is bounded; arguments are not user-tainted. Allowlist
      # mirrors L0 refs.go's G204 exemption.
      - path: internal/securitygate/gate\.go
        linters: [gosec]
        text: "G204"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
