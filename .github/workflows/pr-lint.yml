name: PR lint

# Orchestrator for the per-gate pr-lint-* workflows. The `pr-lint` job below
# is the required-status-check name registered in branch protection on `main`
# (alongside verify/lint/govulncheck/validate). It polls the per-gate
# workflow check-runs for the same head SHA and fails when any gate fails.
#
# Per-gate workflows (each owns its own file = no cascade-rebase when a new
# gate lands):
#   - .github/workflows/pr-lint-release-notes.yml   (release-notes)
#   - .github/workflows/pr-lint-doc-check.yml       (doc-check)
#   - .github/workflows/pr-lint-tdd.yml             (check-tdd)
#   - .github/workflows/pr-lint-reviewer-verdict.yml (check-reviewer-verdict)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: read

jobs:
  pr-lint:
    name: pr-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: wait for per-gate workflows
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GATE_JOBS: "release-notes doc-check check-tdd check-reviewer-verdict"
        run: |
          set -euo pipefail
          # Polls the GitHub Checks API for the per-gate check-runs created
          # by the pr-lint-* workflows. Exits non-zero if any required gate
          # ends in failure/cancelled/timed_out; succeeds when all complete
          # with conclusion=success (or skipped, which GH reports for jobs
          # whose top-level `if:` evaluates false).
          deadline=$(( $(date +%s) + 18*60 ))
          required=( $GATE_JOBS )
          while :; do
            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then
              echo "::error::pr-lint orchestrator timed out waiting for per-gate workflows."
              exit 1
            fi
            # Fetch all check-runs for the head SHA. Filter to required job names.
            runs_json=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | {name, status, conclusion}]')
            pending=0
            failed=0
            missing=()
            for name in "${required[@]}"; do
              if [ "$name" = "pr-lint" ]; then continue; fi
              row=$(printf '%s' "$runs_json" | jq -r --arg n "$name" '[.[] | select(.name == $n)] | .[0] // empty')
              if [ -z "$row" ] || [ "$row" = "null" ]; then
                missing+=("$name")
                pending=1
                continue
              fi
              status=$(printf '%s' "$row" | jq -r '.status // ""')
              conclusion=$(printf '%s' "$row" | jq -r '.conclusion // ""')
              case "$status" in
                completed)
                  case "$conclusion" in
                    success|skipped|neutral) ;;
                    *) echo "::error::gate '$name' failed (conclusion=$conclusion)"; failed=1 ;;
                  esac
                  ;;
                *) pending=1 ;;
              esac
            done
            if [ "$failed" -eq 1 ]; then
              echo "::error::one or more per-gate workflows failed."
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "all per-gate workflows succeeded."
              exit 0
            fi
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "waiting for gates: ${missing[*]} (and any still in-flight)"
            else
              echo "per-gate workflows still in-flight; polling..."
            fi
            sleep 10
          done
