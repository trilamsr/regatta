name: PR lint

# Orchestrator for the per-gate pr-lint-* workflows. The `pr-lint` job below
# is the required-status-check name registered in branch protection on `main`
# (alongside verify/lint/govulncheck/validate). It polls the per-gate
# workflow check-runs for the same head SHA and fails when any gate fails.
#
# Per-gate workflows (each owns its own file = no cascade-rebase when a new
# gate lands):
#   - .github/workflows/pr-lint-release-notes.yml   (release-notes)
#   - .github/workflows/pr-lint-doc-check.yml       (doc-check)
#   - .github/workflows/pr-lint-tdd.yml             (check-tdd)
#   - .github/workflows/pr-lint-reviewer-verdict.yml (check-reviewer-verdict)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: read

jobs:
  pr-lint:
    name: pr-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: wait for per-gate workflows
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GATE_JOBS: "release-notes doc-check check-tdd check-reviewer-verdict"
          GATE_WORKFLOWS: "pr-lint-release-notes.yml pr-lint-doc-check.yml pr-lint-tdd.yml pr-lint-reviewer-verdict.yml"
        run: |
          set -euo pipefail
          # Polls the GitHub Checks API for the per-gate check-runs created
          # by the pr-lint-* workflows. Exits non-zero if any required gate
          # ends in failure/cancelled/timed_out; succeeds when all complete
          # with conclusion=success (or skipped, which GH reports for jobs
          # whose top-level `if:` evaluates false).
          #
          # Fast-fail: probe workflow registration AND triggered-run at
          # the head SHA. A missing/invalid per-gate workflow (YAML syntax
          # error, file rename, path-filter exclusion) would otherwise
          # spin the orchestrator until the 18-minute deadline. Grace
          # period waits for the per-gate `pull_request` event to enqueue
          # before declaring missing (closes #982).
          for wf in $GATE_WORKFLOWS; do
            if ! gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPO}/actions/workflows/${wf}" \
              --jq '.state' >/dev/null 2>&1; then
              echo "::error::per-gate workflow '${wf}' is not registered; check for YAML syntax errors or rename."
              exit 1
            fi
          done
          # Allow GitHub up to 90s to enqueue per-gate runs at HEAD_SHA;
          # then assert at least one workflow_run row per gate workflow.
          probe_deadline=$(( $(date +%s) + 90 ))
          while :; do
            missing_runs=()
            for wf in $GATE_WORKFLOWS; do
              count=$(gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${REPO}/actions/workflows/${wf}/runs?head_sha=${HEAD_SHA}&per_page=1" \
                --jq '.total_count // 0')
              if [ "${count:-0}" -eq 0 ]; then
                missing_runs+=("$wf")
              fi
            done
            if [ "${#missing_runs[@]}" -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$probe_deadline" ]; then
              echo "::error::per-gate workflow(s) never triggered at HEAD_SHA after 90s grace: ${missing_runs[*]}. Likely cause: path-filter exclusion or workflow trigger mismatch."
              exit 1
            fi
            sleep 5
          done
          deadline=$(( $(date +%s) + 18*60 ))
          required=( $GATE_JOBS )
          while :; do
            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then
              echo "::error::pr-lint orchestrator timed out waiting for per-gate workflows."
              exit 1
            fi
            # Fetch all check-runs for the head SHA across pages. The Checks
            # API caps `per_page` at 100 — paginate so a check-run matrix
            # expansion beyond 100 entries does not silently drop required
            # gates from the result set (closes #982).
            runs_json='[]'
            page=1
            while :; do
              page_json=$(gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100&page=${page}" \
                --jq '[.check_runs[] | {name, status, conclusion}]')
              count=$(printf '%s' "$page_json" | jq 'length')
              runs_json=$(jq -s '.[0] + .[1]' <(printf '%s' "$runs_json") <(printf '%s' "$page_json"))
              if [ "$count" -lt 100 ]; then
                break
              fi
              page=$((page + 1))
            done
            pending=0
            failed=0
            missing=()
            for name in "${required[@]}"; do
              if [ "$name" = "pr-lint" ]; then continue; fi
              row=$(printf '%s' "$runs_json" | jq -r --arg n "$name" '[.[] | select(.name == $n)] | .[0] // empty')
              if [ -z "$row" ] || [ "$row" = "null" ]; then
                missing+=("$name")
                pending=1
                continue
              fi
              status=$(printf '%s' "$row" | jq -r '.status // ""')
              conclusion=$(printf '%s' "$row" | jq -r '.conclusion // ""')
              case "$status" in
                completed)
                  case "$conclusion" in
                    success|skipped|neutral) ;;
                    *) echo "::error::gate '$name' failed (conclusion=$conclusion)"; failed=1 ;;
                  esac
                  ;;
                *) pending=1 ;;
              esac
            done
            if [ "$failed" -eq 1 ]; then
              echo "::error::one or more per-gate workflows failed."
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "all per-gate workflows succeeded."
              exit 0
            fi
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "waiting for gates: ${missing[*]} (and any still in-flight)"
            else
              echo "per-gate workflows still in-flight; polling..."
            fi
            sleep 10
          done
