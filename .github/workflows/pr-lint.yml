name: PR lint

# Consolidated pr-lint gate. Prior split (5 files: pr-lint + 4 per-gate
# workflows) was a cascade-rebase avoidance pattern that outlived its
# usefulness — each new gate now adds a job, not a file. The `pr-lint` job
# below is the required-status-check name registered in branch protection
# on `main` (alongside verify/lint/govulncheck/validate); it aggregates
# the 4 per-gate jobs via `needs:` so a single required check still
# gates merges while each gate emits its own check-run.
#
# Jobs run in parallel (no `needs:` between gates) so a failure in one
# gate does not mask findings in another (fail-fast off).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doc-check:
    name: doc-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: doc-check
        run: |
          set -euo pipefail
          bash scripts/doc-check.sh

  release-notes:
    name: release-notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # N2 (#1265): fetch live PR body via `gh pr view` instead of the
      # event payload snapshot. The `github.event.pull_request.body`
      # context is captured at trigger time and goes stale on body
      # edits, forcing operator empty-commit refreshes. Live fetch
      # eliminates the snapshot lag; SNAPSHOT_BODY is retained as
      # fallback when the API call fails.
      - name: release-notes block edited
        if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
        env:
          SNAPSHOT_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # N2 live body fetch w/ snapshot fallback.
          if BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body' 2>/dev/null) && [ -n "$BODY" ]; then
            echo "::notice::pr-body fetched live via gh pr view at $(date -u +%FT%TZ)"
          else
            BODY="$SNAPSHOT_BODY"
            echo "::warning::pr-body live fetch failed; falling back to event-payload snapshot"
          fi
          # Skip the check entirely when the PR only touches paths with no
          # user-visible runtime behavior (docs, CI, build system, tooling
          # pins). A release-notes block on those is theatre. Exiting 0 here
          # marks the required check passing.
          # BASE_SHA from the event payload snapshots at PR-open and
          # only refreshes on PR events; if main moved between events
          # the diff window pulls in unrelated commits and the skip
          # heuristic flips off. Recompute the live merge-base when
          # origin/main is fetched (this checkout uses fetch-depth: 0).
          base="${BASE_SHA}"
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            live_base="$(git merge-base origin/main "${HEAD_SHA}" 2>/dev/null || echo "")"
            if [ -n "$live_base" ]; then base="$live_base"; fi
          fi
          mapfile -t changed < <(git diff --name-only "$base" "${HEAD_SHA}")
          if [ "${#changed[@]}" -gt 0 ]; then
            skip=1
            for f in "${changed[@]}"; do
              case "$f" in
                *.md|docs/*) ;;
                .github/*) ;;
                scripts/*) ;;
                Makefile|Makefile.d/*|.gitignore|.gitattributes) ;;
                .claude/*|.mcp.json) ;;
                *) skip=0; break ;;
              esac
            done
            if [ "$skip" -eq 1 ]; then
              echo "PR only touches docs/CI/build-tooling - release-notes block check skipped."
              exit 0
            fi
          fi

          if [ -z "${BODY:-}" ]; then
            echo "::error::PR description is empty. Use the PR template and fill in the release-notes block."
            exit 1
          fi
          block=$(printf '%s\n' "$BODY" | awk '
            /^```release-notes/ { capture=1; next }
            capture && /^```/    { exit }
            capture              { print }
          ')
          if [ -z "$block" ]; then
            echo "::error::No \`\`\`release-notes\`\`\` block found in the PR description."
            exit 1
          fi
          trimmed=$(printf '%s' "$block" | tr -d '[:space:]')
          if [ -z "$trimmed" ]; then
            echo "::error::release-notes block is empty. Either describe the user-visible change or write 'NONE'."
            exit 1
          fi
          echo "release-notes block ok:"
          printf '%s\n' "$block"


  pr-lint:
    name: pr-lint
    runs-on: ubuntu-latest
    needs: [doc-check, release-notes]
    if: always()
    timeout-minutes: 2
    steps:
      - name: aggregate gate results
        env:
          DOC_CHECK: ${{ needs.doc-check.result }}
          RELEASE_NOTES: ${{ needs.release-notes.result }}
        run: |
          set -euo pipefail
          failed=0
          for name_val in \
            "doc-check=$DOC_CHECK" \
            "release-notes=$RELEASE_NOTES"; do
            name="${name_val%%=*}"
            result="${name_val#*=}"
            case "$result" in
              success|skipped) echo "gate '$name': $result" ;;
              *)               echo "::error::gate '$name': $result"; failed=1 ;;
            esac
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::one or more per-gate jobs failed."
            exit 1
          fi
          echo "all per-gate jobs succeeded."
