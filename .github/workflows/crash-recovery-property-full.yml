name: crash-recovery-property-full

# 2000-case crash-recovery property sweep. Spec:
# docs/engineer/specs/2026-06-02-s3-t4-crash-recovery-property.md §3.4 + §3.6 (T3).
#
# Cadence: nightly 06:00 UTC + manual workflow_dispatch. Per-PR runs use the
# 200-case quick-mode in `make property-test` (PHASE-S-RELAX). The 2000-case
# sweep stays nightly because GitHub-hosted runners are noisy and the ≤90s
# wallclock budget can flip flaky under contention.
#
# Failure mode: on red, the rapid-shrunk seed prints in the test log; the
# uploaded artifact preserves the full test output for triage.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crash-recovery-property-full:
    name: rapid 2000-case sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: run crash-recovery property sweep
        run: |
          set -o pipefail
          mkdir -p "${{ runner.temp }}/crash-recovery-reports"
          make crash-recovery-property-full 2>&1 | tee "${{ runner.temp }}/crash-recovery-reports/test-output.log"

      - name: upload test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: crash-recovery-property-output
          path: ${{ runner.temp }}/crash-recovery-reports
          retention-days: 30
