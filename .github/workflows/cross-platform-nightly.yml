name: cross-platform-nightly

# Nightly cross-platform Go test sweep. macOS dropped from per-PR ci.yml
# (saves ~85s runner quota + queue time). Linux+macOS still validated
# daily here on cron + on request via workflow_dispatch.
#
# This job ALSO runs `go test -race ./...` across ALL packages (vs the
# per-PR ci.yml verify-go shards which restrict `-race` to the
# scripts/race-pkgs.txt allowlist). Catches any race in a package whose
# prod code looked single-threaded but whose tests fan out goroutines.
#
# PHASE-S-RELAX: windows-latest dropped from the matrix during the
# self-host-first window (docs/engineer/briefs/2026-06-01-self-host-first.md).
# Restore alongside `os: [ubuntu-latest, macos-latest, windows-latest]` at the
# 30-day-green trigger or first external-customer ask.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-platform-test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: make go-check-full
        run: make go-check-full
