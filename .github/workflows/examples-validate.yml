name: examples-validate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: validate examples/*/regatta.yaml
        run: |
          set -euo pipefail
          fail=0
          for f in examples/*/regatta.yaml; do
            [ -f "$f" ] || continue
            echo "validating $f"
            if ! go run ./cmd/regatta validate-config --config "$f"; then
              echo "::error file=$f::validate-config failed"
              fail=1
            fi
          done
          exit "$fail"
