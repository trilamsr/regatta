name: examples-validate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: validate examples/*/regatta.yaml
        run: |
          set -euo pipefail
          fail=0
          for f in examples/*/regatta.yaml; do
            [ -f "$f" ] || continue
            echo "validating $f"
            if ! go run ./cmd/regatta validate-config --config "$f"; then
              echo "::error file=$f::validate-config failed"
              fail=1
            fi
          done
          exit "$fail"
