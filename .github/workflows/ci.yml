name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `verify` is split into 4 file-disjoint shards that fan out under the same
  # ubuntu-latest + setup-go cache. The aggregator `verify` job below keeps the
  # branch-protection required-check name stable — it depends on all 4 shards
  # and reports success only when each passes. Local `make ci` stays serial.
  verify-docs:
    name: verify-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: make check-docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make check-docs

  verify-go:
    name: verify-go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: make check-go
        run: make check-go

  verify-property:
    name: verify-property
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: make check-property
        run: make check-property

  verify-stale-todo:
    name: verify-stale-todo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - name: make check-stale-todo
        run: make check-stale-todo

  # Aggregator preserves the `verify` required-check name so branch protection
  # needs no update when the shards are introduced. Fails closed if any shard
  # fails, was cancelled, or was skipped.
  verify:
    name: verify
    needs: [verify-docs, verify-go, verify-property, verify-stale-todo]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: aggregate shard results
        run: |
          set -euo pipefail
          docs='${{ needs.verify-docs.result }}'
          go='${{ needs.verify-go.result }}'
          prop='${{ needs.verify-property.result }}'
          stale='${{ needs.verify-stale-todo.result }}'
          echo "verify-docs=$docs"
          echo "verify-go=$go"
          echo "verify-property=$prop"
          echo "verify-stale-todo=$stale"
          for r in "$docs" "$go" "$prop" "$stale"; do
            if [ "$r" != "success" ]; then
              echo "verify: shard non-success ($r)"
              exit 1
            fi
          done
          echo "verify: all shards green"

  # Cross-platform Go test sweep. Production targets are Linux + macOS;
  # Windows is supported as a developer/tooling target (gopls,
  # cross-build) — orchestrator pid-liveness has a Windows stub in
  # orchestrator_windows.go and unix-only e2e tests are build-tagged.
  # Doc-gates + golangci-lint stay ubuntu-only (verify + lint jobs)
  # because the bash scripts and pinned linter action are not portable.
  #
  # PHASE-S-RELAX: windows-latest dropped from the matrix during the
  # self-host-first window (docs/engineer/briefs/2026-06-01-self-host-first.md).
  # Restore alongside `os: [macos-latest, windows-latest]` at the 30-day-green
  # trigger or first external-customer ask. Memory: feedback_gate_relaxation_phase_s.
  cross-platform-test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build -buildvcs=false ./...
      - name: go test
        run: go test -short ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9  # v8.0.0
        with:
          version: v2.12.2
