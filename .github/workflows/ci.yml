name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `verify` is the aggregator for these file-disjoint shards:
  #   verify-docs         bash doc/citation gates (~30s)
  #   verify-go-{1..4}    sharded `go test -short` partitioned by historical
  #                       per-package time (greedy bin-pack via
  #                       scripts/go-shards/shard-N.txt). Each shard takes
  #                       ~250s of CPU-time; wall-clock ≤3min in CI.
  #                       Race detector (`-race`) runs ONLY on packages
  #                       listed in scripts/race-pkgs.txt (30/84 packages
  #                       use concurrency in prod code).
  #   verify-stale-todo   cross-tree TODO age scan (~30s)
  #
  # `verify-property` was demoted to the property-full job in nightly.yml.
  # `cross-platform-test (macos)` was demoted to the cross-platform-test job in nightly.yml.
  # See PR body for before/after wall-clock measurements.
  verify-docs:
    name: verify-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: make check-docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make check-docs

  verify-go-1:
    name: verify-go-1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go-check-shard 1
        run: make go-check-shard SHARD=1

  verify-go-2:
    name: verify-go-2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go-check-shard 2
        run: make go-check-shard SHARD=2

  verify-go-3:
    name: verify-go-3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go-check-shard 3
        run: make go-check-shard SHARD=3

  verify-go-4:
    name: verify-go-4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go-check-shard 4
        run: make go-check-shard SHARD=4

  # verify-go aggregator preserves the branch-protection required-check name.
  # Fails closed when any verify-go-<N> shard fails / is cancelled / is skipped.
  verify-go:
    name: verify-go
    needs: [verify-go-1, verify-go-2, verify-go-3, verify-go-4]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: aggregate verify-go shards
        run: |
          set -euo pipefail
          s1='${{ needs.verify-go-1.result }}'
          s2='${{ needs.verify-go-2.result }}'
          s3='${{ needs.verify-go-3.result }}'
          s4='${{ needs.verify-go-4.result }}'
          echo "verify-go-1=$s1"
          echo "verify-go-2=$s2"
          echo "verify-go-3=$s3"
          echo "verify-go-4=$s4"
          for r in "$s1" "$s2" "$s3" "$s4"; do
            if [ "$r" != "success" ]; then
              echo "verify-go: shard non-success ($r)"
              exit 1
            fi
          done
          echo "verify-go: all 4 shards green"

  verify-stale-todo:
    name: verify-stale-todo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - name: make check-stale-todo
        run: make check-stale-todo

  # Aggregator preserves the `verify` required-check name so branch protection
  # needs no update. Fails closed if any sub-shard fails / is cancelled / is
  # skipped.
  verify:
    name: verify
    needs: [verify-docs, verify-go, verify-stale-todo]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: aggregate shard results
        run: |
          set -euo pipefail
          docs='${{ needs.verify-docs.result }}'
          go='${{ needs.verify-go.result }}'
          stale='${{ needs.verify-stale-todo.result }}'
          echo "verify-docs=$docs"
          echo "verify-go=$go"
          echo "verify-stale-todo=$stale"
          for r in "$docs" "$go" "$stale"; do
            if [ "$r" != "success" ]; then
              echo "verify: shard non-success ($r)"
              exit 1
            fi
          done
          echo "verify: all shards green"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.12.2

  # R-MEGA-3 INT-5: integration-test job kept separate from unit shards so
  # fast feedback is preserved. Skips [DOCS]/[CHORE]/[CI]/[NONE]/[CHANGE]
  # PRs via the release-notes prefix in the PR title — those categories
  # never touch runtime surfaces this job exercises.
  verify-integration:
    name: verify-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || (!startsWith(github.event.pull_request.title, '[DOCS]') && !startsWith(github.event.pull_request.title, '[CHORE]') && !startsWith(github.event.pull_request.title, '[CI]') && !startsWith(github.event.pull_request.title, '[NONE]') && !startsWith(github.event.pull_request.title, '[CHANGE]'))
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build regatta image
        # docker-compose.yml carries BOTH `image: regatta:stage2` AND
        # `build: context: .`. `compose up --wait` treats the `image:` field
        # as a pullable ref first, tries Docker Hub, and gets `pull access
        # denied for regatta, repository does not exist`; the ensuing
        # fallback-build races the health-check window and reports
        # `container regatta-regatta-1 is unhealthy`. Pre-build the
        # regatta service so the tag exists locally before compose runs
        # (regatta-init is `image: busybox` — no build stanza).
        run: docker compose -f docker-compose.yml build regatta
      - name: make integration
        env:
          # Preflight (cmd/regatta/wire_spawner_auth_preflight.go line 13) is a
          # boundary-presence check only — never probes the credential itself.
          # CI runners have no real ~/.claude mount and no real subscription
          # token; a fake non-empty token satisfies the gate without weakening
          # posture — spawner never runs during HTTP-surface integration
          # (the test only probes /healthz, /readyz, /ui/* routes).
          CLAUDE_CODE_OAUTH_TOKEN: ci-preflight-fake-boundary-token
          # regatta.yaml has spec_adapter.type=github_issues → adapter init
          # requires GH_TOKEN. HTTP integration tests do not exercise the
          # adapter (only /healthz, /readyz, /ui/* routes), so the built-in
          # workflow token (read-only for public repos) is sufficient.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make integration
