name: verify-property-nightly

# Property tests (rapid.checks=50) moved from per-PR blocking to nightly +
# manual dispatch. Per-PR feedback saves ~100s wall-clock. Property
# coverage still runs daily against main + on request via workflow_dispatch.
#
# Why demote: the property suite shrinks shrink-driven regressions over weeks,
# not per-PR. A property regression that lands in a PR fires within 24h here
# and is back-fixable at low cost — and the full 200-case sweep already runs
# weekly via property-test-full.
#
# Failure mode: rapid-shrunk seed prints in the test log; uploaded artifact
# preserves the full output for triage.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  property-test:
    name: rapid 50-case property sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: run property sweep
        run: |
          set -o pipefail
          mkdir -p "${{ runner.temp }}/property-reports"
          make check-property 2>&1 | tee "${{ runner.temp }}/property-reports/test-output.log"

      - name: upload test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: property-test-output
          path: ${{ runner.temp }}/property-reports
          retention-days: 30
