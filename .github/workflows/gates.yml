name: gates

# Fail-closed aggregator. GitHub treats SKIPPED required checks as
# satisfied, so a naive aggregator silently bypasses branch protection.
# Shape enforced by scripts/check-ci-shape.sh.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  aggregate:
    name: aggregate
    runs-on: ubuntu-latest
    needs: []
    if: always()
    steps:
      - name: fail if any needed job did not succeed
        run: |
          status="${{ needs.verify.result || 'success' }}"
          if [ "$status" != "success" ]; then
            echo "aggregator: verify needs.result=$status (not success)"
            exit 1
          fi
          echo "aggregator: all needs.*.result green"
