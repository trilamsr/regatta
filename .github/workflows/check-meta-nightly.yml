# check-meta runs the GATE + GENERATOR SELF-TESTS (fixtures that prove
# scripts/check-*.sh, scripts/doc-check.sh, scripts/gen-*.sh work). These are
# META — they test the scripts themselves, not the code-under-review — so
# running them on every PR wastes ~14s of pre-push budget. Demoted from
# `make check` to nightly + path-filter trigger in MAY-30.
#
# Triggers:
#   - schedule: 06:00 UTC daily (catches drift between PRs)
#   - push:     only when the diff touches a gate/generator script, its
#               self-test, or the wiring Makefile.d/*.mk file
#               (path-filter ensures gate edits still get exercised pre-merge)
#   - workflow_dispatch: manual rerun
name: check-meta

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  push:
    paths:
      - 'scripts/check-*.sh'
      - 'scripts/check-*_test.sh'
      - 'scripts/check_state_tier_order_test.sh'
      - 'scripts/doc-check.sh'
      - 'scripts/doc-check_test.sh'
      - 'scripts/gen-*.sh'
      - 'scripts/gen-*_test.sh'
      - 'Makefile.d/ci.mk'
      - 'Makefile.d/lint.mk'
      - 'Makefile.d/specs.mk'
      - 'Makefile.d/boot-status.mk'
      - '.github/workflows/check-meta-nightly.yml'
  pull_request:
    paths:
      - 'scripts/check-*.sh'
      - 'scripts/check-*_test.sh'
      - 'scripts/check_state_tier_order_test.sh'
      - 'scripts/doc-check.sh'
      - 'scripts/doc-check_test.sh'
      - 'scripts/gen-*.sh'
      - 'scripts/gen-*_test.sh'
      - 'Makefile.d/ci.mk'
      - 'Makefile.d/lint.mk'
      - 'Makefile.d/specs.mk'
      - 'Makefile.d/boot-status.mk'
      - '.github/workflows/check-meta-nightly.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-meta:
    name: gate-and-generator-self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # check-stale-refs_test.sh + check-tdd_test.sh fixture-replay needs full history
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: run gate + generator self-tests
        run: make check-meta
