# check-meta runs the GATE SELF-TESTS (fixtures that prove scripts/check-*.sh
# work). These are META — they test the gate scripts themselves, not the
# code-under-review — so running them on every PR wastes ~14s of pre-push
# budget. Demoted from `make check` to nightly + path-filter trigger in MAY-30.
#
# Triggers:
#   - schedule: 06:00 UTC daily (catches drift between PRs)
#   - push:     only when the diff touches a gate script or its self-test
#               (path-filter ensures gate edits still get exercised pre-merge)
#   - workflow_dispatch: manual rerun
name: check-meta

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  push:
    paths:
      - 'scripts/check-*.sh'
      - 'scripts/check-*_test.sh'
      - 'scripts/check_state_tier_order_test.sh'
      - 'scripts/doc-check.sh'
      - 'scripts/doc-check_test.sh'
      - 'Makefile.d/ci.mk'
      - 'Makefile.d/lint.mk'
      - '.github/workflows/check-meta-nightly.yml'
  pull_request:
    paths:
      - 'scripts/check-*.sh'
      - 'scripts/check-*_test.sh'
      - 'scripts/check_state_tier_order_test.sh'
      - 'scripts/doc-check.sh'
      - 'scripts/doc-check_test.sh'
      - 'Makefile.d/ci.mk'
      - 'Makefile.d/lint.mk'
      - '.github/workflows/check-meta-nightly.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-meta:
    name: gate-self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0  # check-stale-refs_test.sh + check-tdd_test.sh fixture-replay needs full history
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: run gate self-tests
        run: make check-meta
