name: release

# Tag-triggered release. Contract in docs/engineer/release-runbook.md.
# Maintainer flips CHANGELOG Unreleased -> dated section manually
# before tagging; this workflow only builds + attests + publishes.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: verify tag is signed
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! git tag --verify "$tag" 2>/dev/null; then
            echo "release: tag $tag is not signed - aborting"
            exit 1
          fi

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: run gates at tagged commit
        run: make ci-check

      - name: build artifact
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/regatta ./cmd/regatta

      - name: generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@619dbb2e03d9834d0e0c4f4d9fb2ce30cfb6d4c4  # v3.0.0
        with:
          subject-path: dist/regatta

      - name: create GitHub Release with artifact
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/regatta
        env:
          GH_TOKEN: ${{ github.token }}
