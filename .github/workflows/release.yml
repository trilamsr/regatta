name: release

# Tag-triggered release. Contract in docs/engineer/release-runbook.md.
# Maintainer flips CHANGELOG Unreleased -> dated section manually
# before tagging; this workflow only builds + attests + publishes.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: verify tag signature via GitHub API
        # git tag --verify cannot validate SSH-signed tags on a fresh
        # runner (no gpg.ssh.allowedSignersFile). GitHub already
        # verifies signatures against the tagger's registered signing
        # key and exposes the result via the API.
        run: |
          tag="${GITHUB_REF_NAME}"
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" --jq '.object.sha')
          verified=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.verification.verified')
          reason=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.verification.reason')
          if [ "$verified" != "true" ]; then
            echo "release: tag $tag signature not verified by GitHub (reason: $reason) - aborting"
            exit 1
          fi
          echo "release: tag $tag signature verified (reason: $reason)"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: run gates at tagged commit
        run: make ci-check

      - name: build artifact
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/regatta ./cmd/regatta

      - name: generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-path: dist/regatta

      - name: create GitHub Release with artifact
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/regatta
        env:
          GH_TOKEN: ${{ github.token }}
