name: mutation-testing

# Mutation testing on cost-governor + scheduler packages. Spec:
# docs/engineer/specs/2026-06-02-s2-t4-mutation-testing.md.
#
# Cadence: weekly Monday 07:00 UTC (§4.1) + manual workflow_dispatch.
# Per-PR runs are out-of-scope — gremlins is `go test` × N-mutants, far
# slower than `make check`. Spec §4.1 details the rationale.
#
# Failure mode: weekly run uploads JSON artifacts on every run; the
# follow-up issue filer (spec §4.3, T4) lands in a separate wave.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package paths (overrides allowlist). Empty = full allowlist."
        required: false
        default: ""
      no_threshold:
        description: "Set to 1 to report without enforcing per-package floors."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation-test:
    name: gremlins
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Pin gremlins version — go install @latest re-resolves on every run and
      # can drop CI into an unintended upgrade window.
      GREMLINS_VERSION: v0.6.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@${GREMLINS_VERSION}

      - name: run mutation tests
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/mutation-reports
          GREMLINS_PACKAGES: ${{ github.event.inputs.packages }}
          NO_THRESHOLD: ${{ github.event.inputs.no_threshold }}
        run: bash scripts/mutation/run-gremlins.sh

      - name: upload mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-reports
          path: ${{ runner.temp }}/mutation-reports
          retention-days: 90
