# 30d soak window starts 2026-06-10; revisit branch-protection after 2026-07-10. Tracks #1237.
#
# WHY no paths: filter — govulncheck is on the branch-protection required list,
# so PRs that don't touch go.mod/go.sum (e.g. doc-only changes) never trigger
# the workflow and stay stuck at BLOCKED because the required check is "expected
# but missing". Fire on every PR; the job is ~2min and continue-on-error: true
# so it doesn't gate merges on findings, only on presence. Caught 2026-06-10 by
# PR #1273 (doc-only) stuck at BLOCKED.
name: govulncheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # 30d soak window per #1237; revisit 2026-07-10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee  # v1.0.4
        with:
          # go-version-input overrides go-version-file in setup-go; pin to a patched
          # release (GO-2026-5037, GO-2026-5039) so the scan reflects the toolchain
          # ci.yml/release.yml/mutation-testing.yml resolve from go.mod.
          go-version-input: 1.25.11
          go-version-file: go.mod
          repo-checkout: false
