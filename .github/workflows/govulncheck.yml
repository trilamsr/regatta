# 30d soak window starts 2026-06-10; revisit branch-protection after 2026-07-10. Tracks #1237.
#
# WHY no paths: filter — govulncheck is on the branch-protection required list,
# so PRs that don't touch go.mod/go.sum (e.g. doc-only changes) never trigger
# the workflow and stay stuck at BLOCKED because the required check is "expected
# but missing". Fire on every PR; the job is ~2min and continue-on-error: true
# so it doesn't gate merges on findings, only on presence.
name: govulncheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # 30d soak window per #1237; revisit 2026-07-10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee  # v1.0.4
        with:
          # go-version-input overrides go-version-file in setup-go; pin to a patched
          # release (GO-2026-5037, GO-2026-5039, GO-2026-5856) so the scan reflects
          # the toolchain ci.yml/release.yml/mutation-testing.yml resolve from go.mod.
          go-version-input: 1.25.12
          go-version-file: go.mod
          repo-checkout: false
