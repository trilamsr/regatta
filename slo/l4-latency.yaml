# SLO-2 — L4 gate latency
#
# Source spec: docs/engineer/specs/2026-06-02-observability-roadmap.md §5 SLO-2.
# Objective: p95 of regatta_l4_latency_ms_bucket ≤ 30 000 ms (30 s).
# Window:    7d rolling.
# Budget:    1 % of L4 invocations slower than 30 s.
# Alarms:    multi-burn-rate (page + ticket) — same Google SRE workbook shape
#            as SLO-1.
#
# Metric origin: A-T2 (internal/gates/l4). Wire form
# `regatta_l4_latency_ms_bucket` per §2.1 double-unit suffix lock.
#
# Followup: the 1 %/7 d budget is intentionally tight — spec §5 SLO-2 names
# `[OBS-followup] SLO-2 budget widen (5 % OR 28 d window)` filed at A-T5
# merge. Trigger: 30 days of Wave-B real-world burn-rate data. Widen at
# that point if the false-page rate exceeds 1 per week.
#
# Compile with `make slo-compile`; output lands at
# dashboards/prometheus/rules/l4-latency.yaml (Sloth-rendered).
version: "prometheus/v1"
service: "regatta-l4-gate"
labels:
  owner: "regatta"
  tier: "1"
  wave: "a"
  slo_id: "slo-2"
slos:
  - name: "l4-gate-latency"
    objective: 99.0
    description: "p95 L4 gate latency ≤ 30 s. Source: spec §5 SLO-2."
    labels:
      category: "latency"
      runbook: "docs/operator/runbooks/l4-latency.md"
    sli:
      events:
        error_query: |
          (
            sum(rate(regatta_l4_latency_ms_count[{{.window}}]))
            -
            sum(rate(regatta_l4_latency_ms_bucket{le="30000"}[{{.window}}]))
          )
        total_query: |
          sum(rate(regatta_l4_latency_ms_count[{{.window}}]))
    alerting:
      name: L4GateLatencyHigh
      labels:
        category: "latency"
        slo_id: "slo-2"
      annotations:
        summary: "L4 gate p95 latency budget burning"
        runbook: "docs/operator/runbooks/l4-latency.md"
      page_alert:
        labels:
          severity: critical
          sloth_severity: page
      ticket_alert:
        labels:
          severity: warning
          sloth_severity: ticket
