# Full regatta.yaml.
#
# Every option exercised. Reference for operators tuning a real
# deployment. Schema source of truth:
# contracts/schemas/regatta.v1.cue.

version: 1

repo:
  host: github
  owner: example
  name: myproject
  default_branch: main

work_item_source:
  type: github_issues
  selector: 'label:planned'
  acceptance_section: '## Acceptance'

ci:
  command: 'make test && make lint'
  timeout_minutes: 30

pr_template:
  citation_section_required: true
  release_notes_required: true

gates:
  - id: spec_conformance
    type: ai
    model: claude-opus-4-7
    severity_block: ['fail']
  - id: adversarial
    type: ai
    model: claude-sonnet-4-6
    # Per-category model overrides. Unmapped categories fall back to
    # the primary `model` above. Bucketing collapses to one LLM call
    # when every override equals the primary.
    models:
      security: claude-opus-4-7
      refactor: claude-haiku-4-5
    severity_block: ['critical', '2*high']
  - id: drift
    type: ai
    model: claude-haiku-4-5
    severity_block: ['drift']
  - id: security
    type: ai
    model: claude-opus-4-7
    severity_block: ['critical']

lanes:
  - id: server
    paths: ['src/server/**']
    max_concurrency: 1
  - id: client
    paths: ['src/client/**']
    max_concurrency: 1

hotspots:
  - CHANGELOG.md
  - package.json
  - README.md

safety:
  destructive_ops_deny: ['rm -rf', 'git push --force']
  # Allow-override for self-managed agent refs: re-permits a denied op when it
  # also matches an entry here. Default permits force-with-lease on agent-owned
  # regatta/agent-* branches (MAY-97).
  agent_destructive_ops_allow:
    - 'git push --force-with-lease origin regatta/agent-'
  agent_creds_scope: scoped
  iteration_cap: 50
  spend_cap_usd: 50
  spend_cap_usd_per_day: 200
  canary_rate: 0.05
  # soft_cap_mode controls posture at the 80% soft cap. Default
  # `enforce` denies-or-downgrades per work_item annotation. `warn`
  # permits the spawn with only a log event — a silent-overrun risk;
  # enabling it requires soft_cap_acknowledge_overrun: true (issue #226).
  # soft_cap_mode: enforce
  # soft_cap_acknowledge_overrun: false
  # cost-governor demo block (spec §3.6). Uncomment to enable
  # pre-call deny + reconciliation. Reader:
  # docs/operator/cost-governor.md.
  # cost:
  #   per_dag_usd: 100
  #   per_operator_usd: 50
  #   period: 1d
  #   soft_pct: 80
  #   reconcile_interval: 1h
  #   drift_alert_threshold_pct: 10
  #   usage_api_key_env: ANTHROPIC_ADMIN_KEY

context:
  trusted_doc_paths:
    - PRINCIPLES.md
    - STYLE.md
    - AGENTS.md
  agent_guidance_path: AGENTS.md
  agent_guidance_codeowners_check: true

telemetry:
  audit_sink: 's3://acme-audit/regatta/?object-lock=COMPLIANCE'
