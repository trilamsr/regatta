# MVP-3 W6 T6 — dev observability fixture (Jaeger all-in-one).
#
# Spec docs/engineer/specs/2026-05-31-mvp-3-w6-otel-backbone.md §6 T6 +
# §7 A+1 pin this fixture as the E2E proof seam: regatta points at
# localhost:4317 with OTEL_EXPORTER_OTLP_ENDPOINT, the all-in-one
# container ingests OTLP spans, the operator opens the Jaeger UI to
# inspect them.
#
# Operator usage:
#   docker compose -f examples/observability/docker-compose.yml up -d
#   OTEL_EXPORTER_OTLP_ENDPOINT=localhost:4317 regatta serve
#   open http://localhost:16686
#
# Why all-in-one (collector + query + storage in one container): the
# fixture is dev/CI only — production deploys swap their own collector
# in and route to a long-lived backend (Tempo/Honeycomb/Datadog). The
# all-in-one image is what Jaeger's own docs ship as the local-dev
# entry point, so adopting it keeps the on-ramp identical to the
# upstream tutorial. See examples/observability/README.md.

services:
  jaeger:
    # Pinned: avoid `latest` — see Appendix A of the spec for the
    # adopt-by-version rule. Bump deliberately when validating a new
    # release against the regatta E2E suite.
    image: jaegertracing/all-in-one:1.76.0
    container_name: regatta-jaeger
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC ingest (regatta -> jaeger)
      - "4318:4318"   # OTLP HTTP ingest (alt path; not used by default)
      - "16686:16686" # Jaeger query UI + HTTP API (operator + e2e_test.go)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      LOG_LEVEL: "info"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:16686/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
