# AlertManager config for the Stage 2 self-host stack.
#
# Single receiver: regatta-alarm-webhook (#458 W1). Sloth-compiled alert
# rules carry sloth_severity=page or sloth_severity=ticket labels; both
# route to the same receiver today. When W1 ships, the URL becomes the
# actual binding; until then the http://regatta:9095/alarm path is a
# placeholder so the receiver dial fails closed with a clear error
# rather than the alarm getting silently dropped.
#
# AlertManager retries non-2xx with exponential back-off; #519 §8 lays
# out the idempotency + 30s-timeout contract the receiver must honour.

global:
  resolve_timeout: 5m

route:
  receiver: regatta-alarm-webhook
  group_by: ['alertname', 'slo_id']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: regatta-alarm-webhook
    webhook_configs:
      # Placeholder until #458 W1 lands `cmd/regatta-alarm-webhook`.
      # Path is documented in docs/engineer/research/2026-06-02-container-stages.md §8.
      # Bump the port + path here when the receiver ships.
      - url: http://regatta:9095/alarm
        send_resolved: true
        max_alerts: 50

inhibit_rules:
  # A `severity=critical` page suppresses the ticket-tier alert for the
  # same SLO. Mirrors Google SRE workbook multi-window pattern emitted
  # by Sloth.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname', 'slo_id']
