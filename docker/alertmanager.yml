# AlertManager config for the Stage 2 self-host stack.
#
# Single receiver: regatta-alerthook (#458 W1). Sloth-compiled alert
# rules carry sloth_severity=page or sloth_severity=ticket labels; both
# route to the same receiver today.
#
# AlertManager retries non-2xx with exponential back-off; #519 §8 lays
# out the idempotency + 30s-timeout contract the receiver honours.

global:
  resolve_timeout: 5m

route:
  receiver: regatta-alerthook
  group_by: ['alertname', 'slo_id']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: regatta-alerthook
    webhook_configs:
      # regatta-alerthook serves /webhook (internal/alerthook/serve.go).
      # The earlier /alarm path was a placeholder pre-W1; alerts silently
      # 404'd in production until R31 docker-runtime audit caught the drift.
      - url: http://regatta:9095/webhook
        send_resolved: true
        max_alerts: 50

inhibit_rules:
  # A `severity=critical` page suppresses the ticket-tier alert for the
  # same SLO. Mirrors Google SRE workbook multi-window pattern emitted
  # by Sloth.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname', 'slo_id']
